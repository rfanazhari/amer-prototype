name: amer-prototype
services:
  app:
    image: "${APP_IMAGE:-amer-prototype:local}"
    build: .
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    environment:
      HTTP_ADDRESS: ":8080"
      DATABASE_URL: "postgres://amer:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@database:5432/amer_prototype?sslmode=disable"
      APP_ENV: development
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_REALTIME_MODEL: "${OPENAI_REALTIME_MODEL:-}"
      OPENAI_REALTIME_VOICE: "${OPENAI_REALTIME_VOICE:-}"
      OPENAI_REALTIME_URL: "${OPENAI_REALTIME_URL:-}"
    depends_on:
      database:
        condition: service_healthy
    stop_grace_period: 7s
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  database:
    image: postgres:17
    environment:
      POSTGRES_USER: amer
      POSTGRES_DB: amer_prototype
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amer -d amer_prototype"]
      interval: 2s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    profiles: [redis]
    command: [redis-server, --appendonly, "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
  rabbitmq:
    image: rabbitmq:4-management
    profiles: [rabbitmq]
    environment:
      RABBITMQ_DEFAULT_USER: amer
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:-}"
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
