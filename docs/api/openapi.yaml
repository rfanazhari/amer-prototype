    "/voice-sessions": {
      "post": {
        "operationId": "createVoiceSession",
        "summary": "Exchange one WebRTC offer for a provider SDP answer. data contains sdp only.",
        "parameters": [
          {
            "name": "Accept-Language",
            "in": "header",
            "required": false,
            "description": "English by default; Indonesian is selected with id. Standard language preferences are accepted.",
            "schema": {
              "type": "string",
              "example": "id"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/VoiceSessionSetup"
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Provider SDP answer. data.sdp is the only success field.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/VoiceSessionEnvelope"
                }
              }
            }
          },
          "400": {
            "description": "INVALID_INPUT. Malformed JSON, unknown field, non-object body, missing sdp, or blank sdp.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorEnvelope"
                }
              }
            }
          },
          "405": {
            "description": "METHOD_NOT_ALLOWED.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorEnvelope"
                }
              }
            }
          },
          "500": {
            "description": "INTERNAL_ERROR. The technical cause is logged and is not returned.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorEnvelope"
                }
              }
            }
          },
          "503": {
            "description": "SESSION_UNAVAILABLE. Provider setup failed or the provider call could not be completed. The message does not include a technical cause.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorEnvelope"
                }
              }
            }
          }
        }
      },
      "get": {
        "operationId": "getVoiceSessions",
        "summary": "Unsupported. Voice setup accepts POST only.",
        "responses": {
          "405": {
            "description": "METHOD_NOT_ALLOWED.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorEnvelope"
                }
              }
            }
          }
        }
      }
