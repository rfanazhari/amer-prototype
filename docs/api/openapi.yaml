    "/admin/agent-templates": {
      "get": {
        "operationId": "listAgentTemplates",
        "summary": "List supported HR Interviewer and Document Analyzer template versions.",
        "parameters": [
          { "name": "Origin", "in": "header", "required": true, "schema": { "type": "string" } },
          { "name": "Accept-Language", "in": "header", "required": false, "schema": { "type": "string", "example": "id" } }
        ],
        "responses": {
          "200": { "description": "Catalog of supported templates.", "headers": { "Cache-Control": { "schema": { "type": "string", "example": "no-store" } } }, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/AgentCatalogEnvelope" } } } },
          "400": { "description": "INVALID_INPUT.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorEnvelope" } } } },
          "401": { "description": "ACP_UNAUTHENTICATED.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorEnvelope" } } } },
          "403": { "description": "ACP_FORBIDDEN.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorEnvelope" } } } },
          "405": { "description": "METHOD_NOT_ALLOWED.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorEnvelope" } } } }
        }
      }
    },
    "/admin/agent-instances": {
      "post": {
        "operationId": "createAgentInstance",
        "summary": "Create an unpublished instance for a specific template version.",
        "parameters": [
          { "name": "Origin", "in": "header", "required": true, "schema": { "type": "string" } },
          { "name": "X-CSRF-Token", "in": "header", "required": true, "schema": { "type": "string" } },
          { "name": "Accept-Language", "in": "header", "required": false, "schema": { "type": "string" } }
        ],
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/CreateAgentInstance" } } } },
        "responses": {
          "201": { "description": "Created instance with draft version 1.", "headers": { "Cache-Control": { "schema": { "type": "string", "example": "no-store" } } }, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/AgentInstanceEnvelope" } } } },
          "400": { "description": "INVALID_INPUT.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorEnvelope" } } } },
          "401": { "description": "ACP_UNAUTHENTICATED.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorEnvelope" } } } },
          "403": { "description": "ACP_FORBIDDEN.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorEnvelope" } } } },
          "405": { "description": "METHOD_NOT_ALLOWED.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorEnvelope" } } } }
        }
      }
    },
    "/admin/agent-instances/{id}": {
      "parameters": [
        { "name": "id", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } }
      ],
      "get": {
        "operationId": "getAgentInstance",
        "summary": "Read an authorized draft and nullable active revision identity.",
        "parameters": [
          { "name": "Origin", "in": "header", "required": true, "schema": { "type": "string" } },
          { "name": "Accept-Language", "in": "header", "required": false, "schema": { "type": "string" } }
        ],
        "responses": {
          "200": { "description": "Detached instance view.", "headers": { "Cache-Control": { "schema": { "type": "string", "example": "no-store" } } }, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/AgentInstanceEnvelope" } } } },
          "400": { "description": "INVALID_INPUT.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorEnvelope" } } } },
          "401": { "description": "ACP_UNAUTHENTICATED.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorEnvelope" } } } },
          "403": { "description": "ACP_FORBIDDEN.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorEnvelope" } } } },
          "404": { "description": "NOT_FOUND.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorEnvelope" } } } }
        }
      }
    },
    "/admin/agent-instances/{id}/draft": {
      "parameters": [
        { "name": "id", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } }
      ],
      "put": {
        "operationId": "replaceAgentDraft",
        "summary": "Replace the current draft using the expected version.",
        "parameters": [
          { "name": "Origin", "in": "header", "required": true, "schema": { "type": "string" } },
          { "name": "X-CSRF-Token", "in": "header", "required": true, "schema": { "type": "string" } },
          { "name": "Accept-Language", "in": "header", "required": false, "schema": { "type": "string" } }
        ],
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ReplaceAgentDraft" } } } },
        "responses": {
          "200": { "description": "Replaced draft.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/AgentInstanceEnvelope" } } } },
          "400": { "description": "INVALID_INPUT.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorEnvelope" } } } },
          "401": { "description": "ACP_UNAUTHENTICATED.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorEnvelope" } } } },
          "403": { "description": "ACP_FORBIDDEN.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorEnvelope" } } } },
          "404": { "description": "NOT_FOUND.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorEnvelope" } } } },
          "409": { "description": "ACP_DRAFT_CONFLICT.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorEnvelope" } } } }
        }
      }
    },
    "/admin/agent-instances/{id}/validations": {
      "parameters": [
        { "name": "id", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } }
      ],
      "post": {
        "operationId": "validateAgentDraft",
        "summary": "Validate an exact draft version and persist findings.",
        "parameters": [
          { "name": "Origin", "in": "header", "required": true, "schema": { "type": "string" } },
          { "name": "X-CSRF-Token", "in": "header", "required": true, "schema": { "type": "string" } },
          { "name": "Accept-Language", "in": "header", "required": false, "schema": { "type": "string" } }
        ],
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ValidateAgentDraft" } } } },
        "responses": {
          "201": { "description": "Persisted assessment, including blocking findings.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/AgentValidationEnvelope" } } } },
          "400": { "description": "INVALID_INPUT.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorEnvelope" } } } },
          "401": { "description": "ACP_UNAUTHENTICATED.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorEnvelope" } } } },
          "403": { "description": "ACP_FORBIDDEN.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorEnvelope" } } } },
          "404": { "description": "NOT_FOUND.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorEnvelope" } } } },
          "409": { "description": "ACP_DRAFT_CONFLICT.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorEnvelope" } } } },
          "503": { "description": "ACP_DEPENDENCY_UNAVAILABLE.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorEnvelope" } } } }
        }
      }
    },
    "/admin/agent-instances/{id}/publications": {
      "parameters": [
        { "name": "id", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } }
      ],
      "post": {
        "operationId": "publishAgentDraft",
        "summary": "Publish an exact draft and validation, or replay the original result.",
        "parameters": [
          { "name": "Origin", "in": "header", "required": true, "schema": { "type": "string" } },
          { "name": "X-CSRF-Token", "in": "header", "required": true, "schema": { "type": "string" } },
          { "name": "Idempotency-Key", "in": "header", "required": true, "schema": { "type": "string", "pattern": "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$" } },
          { "name": "Accept-Language", "in": "header", "required": false, "schema": { "type": "string" } }
        ],
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/PublishAgentDraft" } } } },
        "responses": {
          "200": { "description": "Same-intent replay of the original revision.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/AgentRevisionEnvelope" } } } },
          "201": { "description": "New published revision.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/AgentRevisionEnvelope" } } } },
          "400": { "description": "INVALID_INPUT.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorEnvelope" } } } },
          "401": { "description": "ACP_UNAUTHENTICATED.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorEnvelope" } } } },
          "403": { "description": "ACP_FORBIDDEN.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorEnvelope" } } } },
          "404": { "description": "NOT_FOUND.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorEnvelope" } } } },
          "409": { "description": "ACP_IDEMPOTENCY_CONFLICT or ACP_DRAFT_CONFLICT or ACP_VALIDATION_CONFLICT.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorEnvelope" } } } },
          "422": { "description": "ACP_PUBLICATION_BLOCKED.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorEnvelope" } } } },
          "503": { "description": "ACP_PUBLICATION_UNCERTAIN or ACP_DEPENDENCY_UNAVAILABLE.", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorEnvelope" } } } }
        }
      }
    },
    "/admin/agent-instances/{id}/revisions/{revision_id}": {
      "parameters": [
        { "name": "id", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } },
        { "name": "revision_id", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } }
      ],
      "get": {
        "operationId": "getAgentRevision",
        "summary": "Read one immutable published revision in authorized scope.",
        "parameters": [
          { "name": "Origin", "in": "header", "required": true, "schema": { "type": "string" } },
          { "name": "Accept-Language", "in": "header", "required": false, "schema": { "type": "string" } }
