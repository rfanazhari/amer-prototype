<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>Candidate interview</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; max-width: 40rem; line-height: 1.5; }
    pre { white-space: pre-wrap; font: inherit; }
    button { font: inherit; padding: 0.5rem 1rem; margin: 0.25rem; }
    button:disabled { opacity: 0.6; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <h1>Candidate interview</h1>
  <p id="status" role="status" aria-live="polite">Loading</p>
  <p id="error" role="alert" hidden></p>
  <section id="notice" aria-label="Interview notice" hidden>
    <pre id="statement"></pre>
    <button id="accept" type="button" hidden>Saya setuju</button>
  </section>
  <p id="progress" hidden></p>
  <button id="start" type="button" hidden>Start interview</button>
  <button id="takeover" type="button" hidden>Take control in this tab</button>
  <button id="voice" type="button" hidden>Start voice</button>
  <p id="voice-status" role="status" aria-live="polite" hidden></p>
  <audio id="remote-audio" autoplay></audio>
  <button id="complete" type="button" hidden>Selesai</button>
  <button id="cancel" type="button" hidden>Cancel interview</button>
  <button id="refresh" type="button" hidden>Refresh interview</button>
  <script>
    (function () {
      var status = document.getElementById("status");
      var notice = document.getElementById("notice");
      var statement = document.getElementById("statement");
      var progress = document.getElementById("progress");
      var error = document.getElementById("error");
      var refresh = document.getElementById("refresh");
      var buttons = {};
      ["accept", "start", "takeover", "complete", "cancel"].forEach(function (name) {
        buttons[name] = document.getElementById(name);
      });
      var voiceButton = document.getElementById("voice");
      var voiceStatus = document.getElementById("voice-status");
      var remoteAudio = document.getElementById("remote-audio");
      var voice = null;
      var voiceBusy = false;
      var voiceToken = 0;
      var csrfToken = "";
      var controllerID = "";
      var view = null;
      var busy = false;
      var active = true;
      var timer = null;
      var generation = 0;

      function stopPolling() {
        clearTimeout(timer);
        timer = null;
      }

      function live() {
        return view && view.execution && ["CREATED", "RUNNING"].indexOf(view.execution.state) >= 0;
      }

      function schedulePoll() {
        stopPolling();
        if (active && !busy && csrfToken && live()) timer = setTimeout(load, 2000);
      }

      function controls() {
        Object.keys(buttons).forEach(function (name) {
          buttons[name].hidden = !view || view.actions.indexOf(name) < 0 ||
            (view.execution && !live());
          buttons[name].disabled = busy;
        });
        voiceButton.hidden = !live() || !view.execution.isCurrentController || !!voice;
        voiceButton.disabled = busy || voiceBusy;
        refresh.disabled = busy;
      }

      function closeVoice() {
        voiceToken++;
        voiceBusy = false;
        if (voice) {
          if (voice.stream) voice.stream.getTracks().forEach(function (track) { track.stop(); });
          if (voice.pc) { try { voice.pc.close(); } catch (_) { /* already closed */ } }
          voice = null;
        }
        remoteAudio.srcObject = null;
        voiceStatus.hidden = true;
      }

      function accessError() {
        generation++;
        closeVoice();
        stopPolling();
        view = null;
        csrfToken = "";
        notice.hidden = true;
        progress.hidden = true;
        error.hidden = true;
        refresh.hidden = true;
        status.textContent = "Access is no longer available";
        controls();
      }

      function unavailable(message) {
        error.textContent = message || "The interview is temporarily unavailable. Please try again.";
        error.hidden = false;
        refresh.hidden = false;
      }

      function render(data) {
        view = data;
        if (voice && (!live() || !data.execution.isCurrentController)) closeVoice();
        notice.hidden = !data.notice || !!data.execution;
        if (data.notice) statement.textContent = data.notice.statement;
        progress.hidden = !live() || !data.progress;
        if (!progress.hidden) progress.textContent = [data.progress.phase, data.progress.connection].filter(Boolean).join(" — ");
        if (data.execution) {
          if (live()) {
            status.textContent = "Interview " + data.execution.state +
              (data.execution.isCurrentController ? " — You control this interview" : " — Read-only in this tab. Take control to cancel.");
          } else {
            var endings = {
              COMPLETED: "Interview COMPLETED. Thank you for your time.",
              FAILED: "Interview FAILED. The interview could not be completed.",
              CANCELLED: "Interview CANCELLED. You have left the interview early."
            };
            status.textContent = endings[data.execution.state] || "The interview is unavailable";
          }
        } else if (!data.notice) {
          status.textContent = "The interview notice is not available yet";
        } else if (!data.consent) {
          status.textContent = "Please read and accept the notice";
        } else {
          status.textContent = data.actions.indexOf("start") >= 0 ? "Notice accepted. Ready to start." : "Notice accepted. Start is not available for this session.";
        }
        controls();
        schedulePoll();
      }

      function load() {
        stopPolling();
        var request = ++generation;
        return fetch("/candidate/interview", {
          credentials: "include",
          headers: { "X-Interview-Controller": controllerID }
        }).then(function (response) {
          if (request !== generation) return;
          if (response.status === 401) { accessError(); return; }
          if (!response.ok) { unavailable(); return; }
          return response.json().then(function (body) {
            if (request !== generation) return;
            error.hidden = true;
            refresh.hidden = true;
            render(body.data);
          });
        }).catch(function () {
          if (request === generation) unavailable();
        }).finally(function () {
          if (request === generation) schedulePoll();
        });
      }

      function startKey(consentID) {
        var key = "candidate-interview-start-" + consentID;
        var intent = sessionStorage.getItem(key);
        if (!intent) {
          intent = crypto.randomUUID();
          sessionStorage.setItem(key, intent);
        }
        return intent;
      }

      function mutate(action) {
        if (busy || !view || view.actions.indexOf(action) < 0) return;
        if (action === "cancel" && !window.confirm("Cancel this interview and leave early?")) return;
        if (action === "complete" && !window.confirm("Finish the interview now? You cannot resume it afterwards.")) return;
        var path, body;
        var headers = { "Content-Type": "application/json", "X-CSRF-Token": csrfToken, "X-Interview-Controller": controllerID };
        try {
          if (action === "accept") {
            path = "/candidate/consents";
            body = { noticeVersion: view.notice.version, accepted: true };
          } else if (action === "start") {
            path = "/candidate/executions";
            body = { consentId: view.consent.id };
            headers["Idempotency-Key"] = startKey(view.consent.id);
          } else {
            path = "/candidate/executions/" + encodeURIComponent(view.execution.id) + "/" + action;
            body = action === "takeover" ?
              { controllerId: controllerID, expectedVersion: view.execution.controllerVersion } :
              { expectedVersion: view.execution.version };
          }
        } catch (_) { unavailable("Browser storage is unavailable. Allow session storage and refresh the page."); return; }
        busy = true;
        stopPolling();
        var request = ++generation;
        error.hidden = true;
        controls();
        fetch(path, { method: "POST", credentials: "include", headers: headers, body: JSON.stringify(body) })
          .then(function (response) {
            if (request !== generation) return;
            if (response.status === 401) { accessError(); return; }
            if (!response.ok) {
              if (response.status === 403 || response.status === 409) {
                return load().then(function () {
                  if (csrfToken) unavailable("The interview changed or this action is unavailable. Review the current screen before trying again.");
                });
              }
              unavailable(action === "start" ? "Start could not be confirmed. Retry Start to reuse the same request, or refresh the interview." : null);
              return;
            }
            return response.json().then(function (body) {
              if (request !== generation) return;
              if (action === "cancel" || action === "complete") {
                render({ notice: view.notice, consent: view.consent, execution: body.data, actions: [], progress: null });
              } else {
                return load();
              }
            });
          }).catch(function () {
            if (request === generation) unavailable(action === "start" ? "Start could not be confirmed. Retry Start to reuse the same request, or refresh the interview." : null);
          }).finally(function () {
            busy = false;
            controls();
            schedulePoll();
          });
      }

      function voiceKey(executionID) {
        var key = "candidate-interview-voice-" + executionID;
        try {
          var intent = sessionStorage.getItem(key);
          if (!intent) {
            intent = crypto.randomUUID();
            sessionStorage.setItem(key, intent);
          }
          return intent;
        } catch (_) { return crypto.randomUUID(); }
      }

      function dropVoiceKey(executionID) {
        try { sessionStorage.removeItem("candidate-interview-voice-" + executionID); } catch (_) { /* storage unavailable */ }
      }

      function voiceFailed(message) {
        closeVoice();
        error.textContent = message;
        error.hidden = false;
        controls();
      }

      function iceComplete(pc) {
        return new Promise(function (resolve) {
          if (pc.iceGatheringState === "complete") { resolve(); return; }
          var timeout = null;
          var check = function () {
            if (pc.iceGatheringState !== "complete") return;
            pc.removeEventListener("icegatheringstatechange", check);
            clearTimeout(timeout);
            resolve();
          };
          timeout = setTimeout(function () {
            pc.removeEventListener("icegatheringstatechange", check);
            resolve();
          }, 10000);
          pc.addEventListener("icegatheringstatechange", check);
        });
      }

      function voicePost(path, body) {
        return fetch(path, {
          method: "POST",
          credentials: "include",
          headers: { "Content-Type": "application/json", "X-CSRF-Token": csrfToken, "X-Interview-Controller": controllerID },
          body: JSON.stringify(body)
        });
      }

      function startVoice() {
        if (voiceBusy || voice || busy || !view || !view.execution || !live() || !view.execution.isCurrentController) return;
        var token = ++voiceToken;
        var execution = view.execution;
        var base = "/candidate/executions/" + encodeURIComponent(execution.id) + "/session-attempts";
        var current = function () { return token === voiceToken; };
        var answered = false;
        voiceBusy = true;
        voice = { stream: null, pc: null };
        error.hidden = true;
        voiceStatus.textContent = "Requesting microphone";
        voiceStatus.hidden = false;
        controls();
        var microphone = (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) ?
          navigator.mediaDevices.getUserMedia({ audio: true }) : Promise.reject(new Error("unsupported"));
        microphone.then(function (stream) {
          if (!current()) { stream.getTracks().forEach(function (track) { track.stop(); }); return null; }
          voice.stream = stream;
          return stream;
        }, function () {
          if (current()) voiceFailed("Microphone access is needed for the voice interview. Allow the microphone and try again.");
          return null;
        }).then(function (stream) {
          if (!stream || !current()) return;
          var pc = new RTCPeerConnection();
          voice.pc = pc;
          stream.getTracks().forEach(function (track) { pc.addTrack(track, stream); });
          pc.createDataChannel("oai-events");
          pc.ontrack = function (event) { remoteAudio.srcObject = event.streams[0]; };
          voiceStatus.textContent = "Connecting voice";
          return pc.createOffer().then(function (offer) {
            return pc.setLocalDescription(offer);
          }).then(function () {
            return iceComplete(pc);
          }).then(function () {
            if (!current()) return;
            return voicePost(base, {
              controllerId: controllerID,
              idempotencyKey: voiceKey(execution.id),
              intent: "activate",
              expectedVersion: execution.version,
              sdp: pc.localDescription.sdp
            });
          }).then(function (response) {
            if (!response || !current()) return;
            if (response.status === 401) { accessError(); return; }
            if (!response.ok) {
              if (response.status === 403 || response.status === 409) {
                dropVoiceKey(execution.id);
                closeVoice();
                return load().then(function () {
                  if (csrfToken) voiceFailed("The interview changed or voice is unavailable. Review the current screen before trying again.");
                });
              }
              voiceFailed("Voice could not be started. Please try again.");
              return;
            }
            return response.json().then(function (body) {
              if (!current()) return;
              answered = true;
              var result = body.data;
              return pc.setRemoteDescription({ type: "answer", sdp: result.sdp }).then(function () {
                return voicePost(base + "/" + encodeURIComponent(result.attemptId) + "/ready", { controllerId: controllerID, expectedVersion: result.executionVersion });
              }).then(function (ready) {
                if (!current()) return;
                if (ready.status === 401) { accessError(); return; }
                if (!ready.ok) { dropVoiceKey(execution.id); voiceFailed("Voice could not be started. Please try again."); return; }
                voiceBusy = false;
                voiceStatus.textContent = "Voice session ready";
                controls();
              });
            });
          });
        }).catch(function () {
          if (!current()) return;
          if (answered) dropVoiceKey(execution.id);
          voiceFailed("Voice could not be started. Please try again.");
        });
      }

      Object.keys(buttons).forEach(function (name) {
        buttons[name].addEventListener("click", function () { mutate(name); });
      });
      voiceButton.addEventListener("click", startVoice);
      refresh.addEventListener("click", function () {
        if (!busy) {
          if (csrfToken) load();
          else initialize();
        }
      });
      window.addEventListener("pagehide", function () { active = false; generation++; closeVoice(); stopPolling(); });
      window.addEventListener("pageshow", function (event) {
        if (event.persisted) { active = true; initialize(); }
      });

      try {
        controllerID = sessionStorage.getItem("candidate-interview-controller");
        if (!controllerID) {
          controllerID = crypto.randomUUID();
          sessionStorage.setItem("candidate-interview-controller", controllerID);
        }
      } catch (_) {
        status.textContent = "Browser storage is unavailable. Allow session storage and reload the page.";
        return;
      }
      function initialize() {
        return fetch("/candidate/session", { credentials: "include" }).then(function (response) {
          if (!response.ok) { accessError(); return; }
          return response.json().then(function (body) {
            csrfToken = body.data.csrfToken;
            return load();
          });
        }).catch(function () { unavailable(); });
      }
      initialize();
    })();
  </script>
</body>
</html>
