<!doctype html><html lang="en"><title>T10 browser fixtures</title><body>
<pre id="result">RUNNING</pre>
<script>
const source = PAGE_SOURCE;
const results = [];
function check(condition, message) { if (!condition) throw new Error(message); }
async function flush() { for (let i = 0; i < 40; i++) await Promise.resolve(); }
async function fixture(view, test, options = {}) {
  const frame = document.createElement('iframe');
  document.body.append(frame);
  const w = frame.contentWindow;
  const calls = [], timers = new Map();
  let timerID = 0;
  w.sessionStorage.clear();
  const reply = (data, status = 200) => Promise.resolve({ok: status < 400, status, json: () => Promise.resolve(JSON.parse(JSON.stringify({data})))});
  w.fetch = (url, init = {}) => {
    calls.push({url, ...init});
    if (options.fetch) { const response = options.fetch(url, init, reply); if (response) return response; }
    if (url === '/candidate/session') return reply({csrfToken: 'fixture-csrf'}, options.unauthenticated ? 401 : 200);
    return reply(view);
  };
  w.setTimeout = w.setInterval = (fn, delay) => { check(delay === 2000, 'poll must wait two seconds'); timers.set(++timerID, fn); return timerID; };
  w.clearTimeout = w.clearInterval = id => timers.delete(id);
  w.confirm = () => false;
  const media = {requests: 0, tracks: [], pcs: [], sdp: 'v=0 fixture-offer-sdp'};
  Object.defineProperty(w.navigator, 'mediaDevices', {configurable: true, value: {getUserMedia: async () => {
    media.requests++;
    if (options.micDenied) throw Object.assign(new Error('denied'), {name: 'NotAllowedError'});
    const track = {stopped: false, stop() { this.stopped = true; }};
    media.tracks.push(track);
    return {getTracks: () => [track]};
  }}});
  w.RTCPeerConnection = class {
    constructor() { this.iceGatheringState = 'complete'; this.closed = false; this.added = []; media.pcs.push(this); }
    addTrack(track) { this.added.push(track); }
    createDataChannel(label) { this.label = label; return {}; }
    async createOffer() { return {type: 'offer', sdp: media.sdp}; }
    async setLocalDescription(description) { this.localDescription = description; }
    async setRemoteDescription(description) { this.remoteDescription = description; }
    close() { this.closed = true; }
  };
  w.document.open(); w.document.write(source); w.document.close();
  await flush();
  const el = id => w.document.getElementById(id);
  const click = async id => { check(el(id) && !el(id).hidden && !el(id).disabled, id + ' must be offered'); el(id).click(); await flush(); };
  const reload = async () => { timers.clear(); w.document.open(); w.document.write(source); w.document.close(); await flush(); };
  const poll = async () => { check(timers.size === 1, 'one active poll'); const fn = timers.values().next().value; timers.clear(); fn(); await flush(); };
  try { await test({w, calls, timers, el, click, poll, reply, reload, media}); } finally { frame.remove(); }
  check(calls.every(c => !(options.voice ? /report/ : /report|session-attempts|\/ready/).test(c.url)), 'no sibling routes');
  check(!options.voice ? media.requests === 0 : true, 'no microphone without the voice scenario');
  check(calls.every(c => c.credentials === 'include'), 'include session cookie');
  results.push(options.name);
}
function screen(state = null, current = true) {
  const execution = state && {id: 'execution-1', state, version: 7, controllerVersion: 3, isCurrentController: current};
  return {notice: {version: 'notice-261102', statement: '<img src=x onerror=alert(1)> Approved notice'}, consent: {id: 'consent-1'}, execution,
    actions: state ? (['COMPLETED', 'FAILED', 'CANCELLED'].includes(state) ? [] : [current ? 'cancel' : 'takeover']) : ['start'], progress: null};
}
(async () => {
  await fixture(screen(), async ({el, calls, timers}) => {
    check(el('notice').hidden, 'no notice without session');
    check(el('status').textContent.includes('Access is no longer available'), 'access-error label');
    check(calls.length === 1 && timers.size === 0, 'access refusal stops requests');
  }, {name: 'missing-cookie', unauthenticated: true});
  const consent = screen(); consent.consent = null; consent.actions = ['accept'];
  await fixture(consent, async ({el, click, calls}) => {
    check(!el('notice').hidden && !el('accept').hidden, 'API notice and accept');
    check(!el('statement').querySelector('img'), 'notice rendered as text');
    await click('accept');
    const call = calls.find(c => c.url === '/candidate/consents');
    check(JSON.parse(call.body).noticeVersion === 'notice-261102' && JSON.parse(call.body).accepted === true, 'explicit consent');
    check(call.headers['X-CSRF-Token'] === 'fixture-csrf', 'CSRF token');
  }, {name: 'notice-consent'});
  await fixture(screen(), async ({w, el, click, calls, reply, reload}) => {
    check(el('start') && !el('start').hidden, 'start offered by API');
    check(!calls.some(c => c.method === 'POST'), 'refresh never starts');
    await click('start');
    await reload();
    await click('start');
    const starts = calls.filter(c => c.url === '/candidate/executions');
    check(starts.length === 2, 'retry can be made after uncertain start');
    check(starts[0].headers['Idempotency-Key'] === starts[1].headers['Idempotency-Key'], 'uncertain retry keeps key');
    check(JSON.parse(starts[0].body).consentId === 'consent-1', 'stored consent id');
    const controller = starts[0].headers['X-Interview-Controller'];
    check(controller && Object.values(w.sessionStorage).includes(controller), 'controller stored in sessionStorage');
    check(calls.filter(c => c.url === '/candidate/interview').every(c => c.headers['X-Interview-Controller'] === controller), 'reads send tab header');
  }, {name: 'start-uncertain-retry', fetch: (url, init, reply) => url === '/candidate/executions' && reply({}, 503)});
  const noActions = screen(); noActions.actions = [];
  await fixture(noActions, async ({el}) => { check(el('start').hidden, 'start hidden unless offered'); }, {name: 'start-policy'});
  const live = screen('RUNNING', false);
  await fixture(live, async ({w, el, click, calls, poll, timers}) => {
    check(el('cancel').hidden && !el('takeover').hidden, 'second tab read-only');
    check(el('status').textContent.toLowerCase().includes('read-only'), 'read-only label');
    await click('takeover');
    const take = calls.find(c => c.url.endsWith('/takeover'));
    check(JSON.parse(take.body).expectedVersion === 3 && JSON.parse(take.body).controllerId === take.headers['X-Interview-Controller'], 'controller version and id');
    check(!el('cancel').hidden, 'takeover enables controller actions after refresh');
    const before = calls.length;
    await click('cancel');
    check(calls.length === before, 'declined confirmation makes no request');
    w.confirm = () => true;
    await click('cancel');
    const cancel = calls.find(c => c.url.endsWith('/cancel'));
    check(JSON.parse(cancel.body).expectedVersion === 7, 'cancel uses execution version');
    check(el('status').textContent.toLowerCase().includes('cancelled'), 'cancel is labelled cancelled');
    check(timers.size === 0, 'cancel stops polling');
  }, {name: 'takeover-confirm-cancel', fetch: (url, init, reply) => {
    if (url.endsWith('/takeover')) { live.execution.isCurrentController = true; live.actions = ['cancel']; return reply({isCurrentController: true, controllerVersion: 4}); }
    if (url.endsWith('/cancel')) { live.execution.state = 'CANCELLED'; live.actions = []; return reply(live.execution); }
  }});
  for (const state of ['COMPLETED', 'FAILED', 'CANCELLED']) {
    await fixture(screen(state), async ({el, timers, calls}) => {
      check(el('status').textContent.toLowerCase().includes(state.toLowerCase()), state + ' immediate outcome');
      check(timers.size === 0, state + ' stops polling');
      check(['accept','start','takeover','cancel'].every(id => el(id).hidden), 'no terminal mutations');
      check(calls.length === 2, 'terminal only session and interview');
    }, {name: 'terminal-' + state});
  }
  const progress = screen('CREATED');
  await fixture(progress, async ({el, poll, timers, calls}) => {
    check(timers.size === 1, 'created polls');
    progress.execution.state = 'COMPLETED'; progress.actions = [];
    await poll();
    check(timers.size === 0 && el('status').textContent.includes('COMPLETED'), 'poll reaches terminal and stops');
  }, {name: 'poll-terminal'});
  for (const status of [200, 201]) {
    const started = screen();
    await fixture(started, async ({click, el, timers, calls, reload}) => {
      await click('start');
      check(el('status').textContent.includes('CREATED') && timers.size === 1, 'successful start renders and polls');
      const tab = calls.find(c => c.url === '/candidate/executions').headers['X-Interview-Controller'];
      await reload();
      check(calls.filter(c => c.method === 'POST').length === 1, 'refresh does not restart');
      check(calls.filter(c => c.url === '/candidate/interview').at(-1).headers['X-Interview-Controller'] === tab, 'refresh retains tab identity');
    }, {name: 'start-' + status + '-refresh', fetch: (url, init, reply) => {
      if (url === '/candidate/executions') { started.execution = screen('CREATED').execution; started.actions = ['cancel']; return reply(started.execution, status); }
    }});
  }
  let finishOldPoll;
  let interviewReads = 0;
  const stale = screen('RUNNING');
  await fixture(stale, async ({poll, click, w, el, timers}) => {
    await poll();
    w.confirm = () => true;
    await click('cancel');
    finishOldPoll(); await flush();
    check(el('status').textContent.includes('CANCELLED') && timers.size === 0, 'late live poll cannot undo cancellation');
  }, {name: 'superseded-poll', fetch: (url, init, reply) => {
    if (url === '/candidate/interview' && ++interviewReads === 2) {
      return new Promise(resolve => { finishOldPoll = () => resolve({ok: true, status: 200, json: () => Promise.resolve({data: screen('RUNNING')})}); });
    }
    if (url.endsWith('/cancel')) return reply(screen('CANCELLED').execution);
  }});
  let reads = 0;
  await fixture(screen('RUNNING'), async ({poll, el, timers}) => {
    await poll();
    check(el('status').textContent.includes('Access is no longer available'), 'expired poll session');
    check(el('cancel').hidden && timers.size === 0, 'expired session hides actions and stops poll');
  }, {name: 'poll-session-expired', fetch: (url, init, reply) => url === '/candidate/interview' && ++reads === 2 && reply({}, 401)});
  const conflict = screen('RUNNING');
  await fixture(conflict, async ({w, click, el}) => {
    w.confirm = () => true;
    await click('cancel');
    check(el('cancel').hidden && !el('takeover').hidden, 'conflict refreshes controller actions');
    check(!el('error').hidden && !el('error').textContent.includes('technical'), 'safe conflict explanation');
  }, {name: 'controller-conflict', fetch: (url, init, reply) => {
    if (url.endsWith('/cancel')) { conflict.execution.isCurrentController = false; conflict.actions = ['takeover']; return reply({}, 409); }
  }});
  const safe = screen('RUNNING'); safe.progress = {phase: '<b>Connecting</b>', connection: 'reconnecting'};
  await fixture(safe, async ({el}) => {
    check(!el('progress').hidden && el('progress').textContent.includes('reconnecting'), 'candidate-safe progress');
    check(!el('progress').querySelector('b'), 'progress rendered as text');
  }, {name: 'safe-progress'});
  let sessionReads = 0;
  await fixture(screen(), async ({click, el, calls}) => {
    check(!el('error').hidden, 'initial network failure is visible');
    await click('refresh');
    check(!el('start').hidden, 'session read can recover');
    check(calls.filter(c => c.url === '/candidate/session').length === 2, 'refresh recovers CSRF before actions');
  }, {name: 'session-network-recovery', fetch: url => url === '/candidate/session' && ++sessionReads === 1 && Promise.reject(new Error('network'))});
  await fixture(screen(), async ({click, el, calls}) => {
    await click('start');
    check(!el('error').hidden && !el('start').disabled, 'lost start response allows explicit retry');
    await click('start');
    const starts = calls.filter(c => c.method === 'POST');
    check(starts[0].headers['Idempotency-Key'] === starts[1].headers['Idempotency-Key'], 'network retry keeps intent');
  }, {name: 'start-network-retry', fetch: url => url === '/candidate/executions' && Promise.reject(new Error('network'))});
  const attemptsPath = '/candidate/executions/execution-1/session-attempts';
  const voiceReplies = (url, reply, overrides = {}) => {
    if (url === attemptsPath) return (overrides.attempt && overrides.attempt()) || reply({attemptId: 'attempt-1', sessionId: 'session-1', sdp: 'fixture-answer-sdp', executionVersion: 8, sessionCondition: 'pending'}, 201);
    if (url === attemptsPath + '/attempt-1/ready') return reply({sessionCondition: 'ready'});
  };
  const open = ({el, media}) => media.tracks.every(t => !t.stopped) && media.pcs.every(pc => !pc.closed);
  const released = ({media}) => media.tracks.length > 0 && media.tracks.every(t => t.stopped) && media.pcs.every(pc => pc.closed);
  await fixture(screen('RUNNING', false), async ({el, media, calls}) => {
    check(el('voice').hidden, 'a read-only tab never offers voice');
    check(media.requests === 0 && !calls.some(c => /session-attempts/.test(c.url)), 'read-only tab requests nothing');
  }, {name: 'voice-hidden-read-only', voice: true});
  const voiceable = screen('RUNNING');
  await fixture(voiceable, async ({w, el, click, calls, media}) => {
    check(!el('voice').hidden, 'controlling tab is offered voice');
    check(media.requests === 0 && !calls.some(c => /session-attempts/.test(c.url)), 'voice starts only after the candidate clicks');
    await click('voice');
    check(media.requests === 1, 'microphone requested once');
    const attempt = calls.find(c => c.url === attemptsPath);
    const body = JSON.parse(attempt.body);
    check(attempt.method === 'POST' && attempt.credentials === 'include', 'cookie-authenticated POST');
    check(attempt.headers['X-CSRF-Token'] === 'fixture-csrf' && attempt.headers['X-Interview-Controller'] === body.controllerId, 'CSRF token and tab controller');
    check(body.intent === 'activate' && body.expectedVersion === 7 && body.sdp === media.sdp && body.idempotencyKey, 'activate body with execution version, offer and key');
    check(media.pcs.length === 1 && media.pcs[0].added.length === 1 && media.pcs[0].label === 'oai-events', 'microphone track and event channel');
    check(media.pcs[0].remoteDescription.type === 'answer' && media.pcs[0].remoteDescription.sdp === 'fixture-answer-sdp', 'returned answer applied');
    const ready = calls.find(c => c.url === attemptsPath + '/attempt-1/ready');
    check(ready && JSON.parse(ready.body).expectedVersion === 8 && JSON.parse(ready.body).controllerId === body.controllerId, 'readiness uses returned version and controller');
    check(el('voice-status').textContent.toLowerCase().includes('ready') && el('voice').hidden, 'ready state replaces the start control');
    check(open({el, media}), 'media stays open while the interview is live');
    const visible = w.document.body.textContent + JSON.stringify(Object.entries(w.sessionStorage));
    check(!visible.includes('fixture-offer-sdp') && !visible.includes('fixture-answer-sdp') && !visible.includes('session-1'), 'SDP and session id never reach DOM or storage');
  }, {name: 'voice-success', voice: true, fetch: (url, init, reply) => voiceReplies(url, reply)});
  await fixture(screen('RUNNING'), async ({el, click, calls, media}) => {
    await click('voice');
    check(!calls.some(c => /session-attempts/.test(c.url)), 'no setup request without a microphone');
    check(!el('error').hidden && el('error').textContent.toLowerCase().includes('microphone'), 'safe microphone explanation');
    check(!el('voice').hidden && !el('voice').disabled, 'candidate can retry after fixing permission');
  }, {name: 'voice-permission-denied', voice: true, micDenied: true});
  await fixture(screen('RUNNING'), async ({el, click, calls, media}) => {
    await click('voice');
    check(released({media}), 'refused setup releases microphone and connection');
    check(!calls.some(c => c.url.endsWith('/ready')), 'no readiness after refusal');
    check(calls.filter(c => c.url === '/candidate/interview').length >= 2, 'conflict refreshes the interview');
    check(!el('error').hidden && !/session|attempt|provider/i.test(el('error').textContent), 'safe conflict explanation');
  }, {name: 'voice-conflict', voice: true, fetch: (url, init, reply) => voiceReplies(url, reply, {attempt: () => reply({}, 409)})});
  let attemptNumber = 0;
  await fixture(screen('RUNNING'), async ({el, click, calls, media}) => {
    await click('voice');
    check(released({media}) && !el('error').hidden, 'unavailable provider releases media and explains');
    media.tracks.length = 0; media.pcs.length = 0;
    await click('voice');
    const attempts = calls.filter(c => c.url === attemptsPath);
    check(attempts.length === 2 && JSON.parse(attempts[0].body).idempotencyKey === JSON.parse(attempts[1].body).idempotencyKey, 'retry after unavailable reuses the key');
    check(el('voice-status').textContent.toLowerCase().includes('ready'), 'retry reaches ready');
  }, {name: 'voice-unavailable-retry', voice: true, fetch: (url, init, reply) => voiceReplies(url, reply, {attempt: () => ++attemptNumber === 1 && reply({}, 503)})});
  const cancelling = screen('RUNNING');
  await fixture(cancelling, async ({w, el, click, media}) => {
    await click('voice');
    check(open({el, media}), 'voice is live before cancel');
    w.confirm = () => true;
    await click('cancel');
    check(released({media}), 'cancel releases microphone and connection');
  }, {name: 'voice-cancel-releases', voice: true, fetch: (url, init, reply) => {
    if (url.endsWith('/cancel')) return reply(screen('CANCELLED').execution);
    return voiceReplies(url, reply);
  }});
  const takenOver = screen('RUNNING');
  await fixture(takenOver, async ({el, click, poll, media}) => {
    await click('voice');
    takenOver.execution.isCurrentController = false; takenOver.actions = ['takeover'];
    await poll();
    check(released({media}) && el('voice').hidden, 'losing control releases voice and hides the control');
  }, {name: 'voice-control-lost', voice: true, fetch: (url, init, reply) => voiceReplies(url, reply)});
  const finishing = screen('RUNNING');
  await fixture(finishing, async ({click, poll, media}) => {
    await click('voice');
    finishing.execution.state = 'COMPLETED'; finishing.actions = [];
    await poll();
    check(released({media}), 'terminal outcome releases voice');
  }, {name: 'voice-terminal-releases', voice: true, fetch: (url, init, reply) => voiceReplies(url, reply)});
  document.getElementById('result').textContent = 'PASS ' + results.length + ' browser scenarios: ' + results.join(', ');
})().catch(error => { document.getElementById('result').textContent = 'FAIL ' + error.message; });
</script></body></html>
