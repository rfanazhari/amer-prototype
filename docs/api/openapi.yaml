{
  "openapi": "3.0.3",
  "info": {
    "title": "amer-prototype Task API",
    "version": "0.2.0",
    "description": "Task reference feature and voice session setup. All active responses use the standard JSON envelope. Unknown routes return 404; unsupported methods return 405. No authentication. Request bodies are limited to 1 MiB. System-owned timestamps, IDs and status are rejected as request fields. Completion events are volatile and process-local. POST /voice-sessions exchanges one WebRTC offer for a provider SDP answer."
  },
  "servers": [
    {
      "url": "http://localhost:8080"
    }
  ],
  "security": [],
  "paths": {
    "/tasks": {
      "post": {
        "operationId": "createTask",
        "summary": "Create a Todo task. dueDate is optional and cannot precede the sampled system time.",
        "parameters": [
          {
            "name": "Accept-Language",
            "in": "header",
            "required": false,
            "description": "English by default; Indonesian is selected with id. Standard language preferences are accepted.",
            "schema": {
              "type": "string",
              "example": "id"
            }
          }
        ],
        "responses": {
          "201": {
            "description": "Resulting task details.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/TaskEnvelope"
                }
              }
            }
          },
          "400": {
            "description": "Safe error. Localized using Accept-Language; technical causes are logged internally.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorEnvelope"
                }
              }
            }
          },
          "405": {
            "description": "Safe error. Localized using Accept-Language; technical causes are logged internally.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorEnvelope"
                }
              }
            }
          },
          "500": {
            "description": "Safe error. Localized using Accept-Language; technical causes are logged internally.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorEnvelope"
                }
              }
            }
          },
          "503": {
            "description": "Safe error. Localized using Accept-Language; technical causes are logged internally.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorEnvelope"
                }
              }
            }
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/CreateTask"
              }
            }
          }
        }
      }
    },
