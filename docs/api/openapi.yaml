{
  "openapi": "3.0.3",
  "info": {
    "title": "amer-prototype Task API",
    "version": "0.6.0",
    "description": "Task reference feature, voice session setup, identity/access, and HR agent configuration. All active responses use the standard JSON envelope. Unknown routes return 404; unsupported methods return 405. Task, voice, and health remain unauthenticated. Request bodies are limited to 1 MiB. System-owned timestamps, IDs and status are rejected as request fields. Completion events are volatile and process-local. POST /voice-sessions exchanges one WebRTC offer for a provider SDP answer. Administrative, candidate, and configuration routes use origin, cookies, and CSRF as documented in identity-access.md, agent-configuration.md and candidate-interview.md."
  },
  "servers": [
    {
      "url": "http://localhost:8080"
    }
  ],
  "security": [],
  "tags": [
    {
      "name": "tasks",
      "description": "Task tracking reference routes."
    },
    {
      "name": "admin-only",
      "description": "ADMIN-only account management. Shared login, current session, and logout also appear here."
    },
    {
      "name": "admin-hr",
      "description": "HR agent configuration, candidates, interview assignments, and invitations. Shared login, current session, and logout also appear here."
    },
    {
      "name": "candidate",
      "description": "Candidate invitation access, session, notice consent and interview read routes."
    },
    {
      "name": "health",
      "description": "Unauthenticated process readiness."
    },
    {
      "name": "voice-sessions",
      "description": "Voice session setup."
    }
  ],
